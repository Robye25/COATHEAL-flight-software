# COATHEAL onboard example configuration

runtime.tick_hz=1.0
runtime.bench_mode=false
runtime.debug_arm_code=COATHEAL_DEBUG
runtime.use_simulated_pwm=false
runtime.use_simulated_sensors=false
runtime.gpio_chip=/dev/gpiochip0

# Rev C manual-first policy. While the ground link is healthy, ARM enables
# operator-directed heater/stepper commands; phase changes never start motion.
# After an established link is lost for the timeout below, the
# onboard continues an active bend sequence and PID targets, stops other
# motion, tracks pressure phases, and applies the +5 C floor to untargeted
# channels.
manual.manual_first=true
manual.link_loss_fallback_enabled=true
manual.link_loss_fallback_s=10.0

# Link-loss failsafe bend plan (operator-loaded with FALLBACK_PLAN and armed
# with FALLBACK_ARM before launch). Executed onboard only while link-loss
# fallback is active at PRE_FLOAT/FLOAT: when the motor's sample group is
# inside [bend_min_c, bend_max_c], or unconditionally once bend_deadline_s
# have passed since fallback first held there. landed_safe turns the heaters
# off and disables both motors the first time fallback is active at LANDED.
fallback.bend_min_c=-40.0
fallback.bend_max_c=40.0
fallback.bend_deadline_s=1800.0
fallback.landed_safe=true

# Empty by default for plug-and-play Ethernet: UDP discovery or the first
# command connection from the GUI selects the telemetry return path.
comms.telemetry_host=
comms.static_ground_ip=
comms.static_pi_ip=169.254.10.10
comms.telemetry_port=4000
comms.command_port=5000
comms.reconnect_ms=2000
comms.discovery_enabled=true
comms.discovery_port=4100
comms.discovery_period_ms=2000
comms.rediscover_period_s=30
comms.failover_grace_s=5
comms.priority=100

storage.primary_log_path=logs/onboard_primary.csv
storage.secondary_log_path=logs/onboard_usb_mirror.csv
storage.queue_dir=logs/telemetry-queue
storage.queue_retention_hours=72.0
storage.queue_max_bytes=8589934592

# Rev C fallback thermal policy. All 6 heated samples are protected by the
# +5 C floor only during link-loss fallback. There is no box heater; samples 6
# and 7 are pulled but unheated.
phase.sample_floor_c=5.0
phase.uniformity_tolerance_c=2.0

# Owner rule 2026-09-15: nothing above 80 C; targets stay 5 C under the
# latch because a film heater overshoots its target.
heater.max_sample_temp_c=80.0
heater.target_min_c=0.0
heater.target_max_c=75.0
# Which BCM line drives each heater and which PT100 it heats: see
# motor0.specimens / motor1.specimens.
# Film heaters have high thermal inertia; 1 Hz software PWM (no hardware PWM
# channel is wired).
heater.pwm_frequency_hz=1.0
heater.active_high=true
heater.debug_max_duty=0.25
heater.debug_max_seconds=10.0
# Global heater power ceiling (0..1]: caps PID output and every duty
# override; commands above it are NACKed. 1.0 = full power for flight.
# Bench: set ~0.25 -- a 5 W film at 100% runs its surface far ahead of a
# lagging PT100 and trips the 85 C latch even with a 40 C target.
heater.max_duty=1.0

sensor.ambient_temp_min_c=-90.0
sensor.ambient_temp_max_c=50.0
sensor.ambient_pressure_min_mbar=5.0
sensor.ambient_pressure_max_mbar=1050.0
sensor.dps310_enabled=true
sensor.ads1115_enabled=true
sensor.dps310_auto_discover=true
sensor.ads1115_auto_discover=true
sensor.dps310_poll_ms=1000
sensor.ads1115_poll_ms=1000
sensor.stale_after_ms=3000

# Sequent Microsystems 8-channel RTD HAT (I2C 0x40 + stack).
sensor.sequent_rtd_stack=0
# Which card terminal each PT100 is on: see motor0.specimens / motor1.specimens.
sensor.sequent_rtd_poll_ms=1000
sensor.sequent_rtd_expect_sensor_type=pt100
sensor.sequent_rtd_resistance_min_ohm=60.0
sensor.sequent_rtd_resistance_max_ohm=390.0
sensor.sequent_rtd_crosscheck_tol_c=2.0

sensor.pressure_source=dps310
sensor.dps310_i2c_addr=0x77
sensor.uv_source=guva_s12sd_ads1115
sensor.ads1115_i2c_addr=0x48
sensor.uv_ads1115_channel=0
sensor.uv_full_scale_v=4.096

# MAX31865 dual-click sample-resistance instrument (schematic v3). Device
# paths are fixed by hardware (CE1/GP07 = click 0 = SAMPLE1 =
# /dev/spidev0.1; CE0/GP08 = click 1 = SAMPLE2 = /dev/spidev0.0), not
# configurable. Owner decision (confirmed 2026-08-29): specimen
# resistance is measured on exactly TWO samples, one per motor group, via
# the two MAX31865 RTD clicks: click 1 reads the first specimen of
# motor0.specimens, click 2 the first of motor1.specimens.
sensor.max31865_reference_ohm=470.0
sensor.max31865_poll_ms=1000
sensor.resistance_source=max31865_click

# Rev C fallback phase transitions. These thresholds are used only while
# link-loss fallback is active.
# ASCENT -> PRE_FLOAT at pre_float_mbar; FLOAT -> DESCENT at
# float_to_descent_mbar; DESCENT -> LANDED at descent_to_landed_mbar.
# All transitions require `debounce_samples` consecutive ticks.
transition.pre_float_mbar=150.0
transition.ascent_to_float_mbar=100.0
transition.float_to_descent_mbar=300.0
transition.descent_to_landed_mbar=800.0
transition.debounce_samples=5

# Final heater spec: 5 W polyimide film heaters. Owner power-budget rule:
# never more than 3 active simultaneously -> 15 W combined thermal draw
# ceiling.
power.max_active_heaters=3
power.max_thermal_w=15.0
power.max_system_w=48.23
power.heater_nominal_w=5.0
power.logic_regulator_v=5.0
power.stepper_regulator_v=12.0
# BEXUS User Manual §5.2: 150 Wh / team flight allocation. Reserve ~20 Wh for
# Pi 4 + sensors + I/O so heater integration latches off at 130 Wh.
# Set to 0 to disable cumulative-energy enforcement.
power.energy_budget_wh=130.0

pid.kp=0.20
pid.ki=0.02
pid.kd=0.03

# Final BOM hardware: 6 sample heaters (5 W each) on 6 of the 8 samples. Heater
# index i drives sample index i (i in 0..5). Samples 6 and 7 are pulled by
# motor 1 but carry no heater — PT100 only. No electronics-box heater, so
# `hardware.electronics_heater_index` is intentionally unset (default sentinel
# SIZE_MAX = "no box heater").
hardware.sample_count=8
hardware.heater_count=6

# The final pinout has no status LEDs. BCM 17 and 27 are reserved (Sequent
# HAT RS485_DIR / motor1 CS respectively) in v3, not available as LED lines.
hal.status_led_enabled=false
hal.mode_led_enabled=false
hal.status_led_line=17
hal.mode_led_line=27

# v3 final BOM: two TMC5160 stepper channels (SPI-only motion, no STEP/DIR)
# pull samples downward. Only one motor pulls at a time (MotionLock) and
# heater duty is zeroed while a pull is active (HeaterScheduler interlock).
# Shared motion settings are under stepper.* and pull.*. All electrical pins
# are under motor0/1.*.
stepper.steps_per_rev=200
stepper.default_step_hz=100.0
stepper.max_position_steps=200000
stepper.enable_on_boot=false
# Ball-screw lead: linear travel per motor revolution. The mm command
# surface (STEPPER_MOVE_MM / STEPPER_MOVETO_MM, mm telemetry keys)
# converts through this value; microstep commands stay raw.
# Owner 2026-09-15: the screws have a 1 mm lead.
stepper.lead_mm_per_rev=1.0
# Owner rule 2026-09-11: linear speed ceiling for every motion path (jog,
# bend, sequences, fallback plan, pulls), in mm/s of ball-screw travel.
# Converted through lead_mm_per_rev and steps_per_rev: 0.5 mm/s = 100
# full-steps/s at the 1 mm lead. The lower of this and pull.max_step_hz is
# the ceiling every STEPPER_SET_SPEED / sequence / plan speed is held to.
stepper.max_speed_mm_s=0.5
# Owner rule 2026-09-11: longest raw-microstep command (|steps| of
# STEPPER_MOVE, |target| of STEPPER_MOVETO / STEPPER_BEND), in microsteps at
# the live divisor: 1000 = 1.25 rev = 1.25 mm at u4 and the 1 mm lead. The mm
# commands, bend sequences and the fallback plan are bounded by
# max_position_steps instead.
stepper.max_direct_usteps=1000
# Ceiling for STEPPER_SET_ACCEL and motorN.accel_steps_per_s2.
stepper.max_accel_steps_per_s2=5000.0

# --- Rev C motion envelope (shared by both motors) ---
# Owner 2026-09-15, 1 mm lead, millimetre values kept: pull rate 100
# full-steps/s (= 0.5 mm/s, 30 rpm; the stepper.max_speed_mm_s ceiling),
# trapezoidal accel/decel at 400 full-steps/s^2 (= 2 mm/s^2, 0.25 s ramp
# 0->100 Hz), and a 2 mm standard pull = 400 full-steps = two revolutions.
# Microstepping 4x (800 usteps/rev = 1 mm) is the commissioning default;
# supported divisors are powers of two, 1..256.
pull.max_step_hz=100.0
pull.accel_steps_per_s2=400.0
pull.microstep=4
pull.travel_full_steps=400
pull.hold_s=5.0

# --- Motor 0 / STEP1 (samples 0..3, v3 pinout CS on BCM 22, EN on BCM 20) ---
# v3: TMC5160, SPI-only motion — no STEP/DIR.
motor0.driver=tmc5160
motor0.gpio_chip=/dev/gpiochip0
motor0.spi_device=/dev/spidev0.0
motor0.cs_line=22
motor0.enable_line=20
# Owner 2026-09-15: motor 0 turns the other way from motor 1 for the same
# command; flipped here so "+" is the same physical direction on both.
motor0.invert_direction=true
motor0.enable_active_low=true
motor0.run_current_a_rms=0.8
motor0.hold_current_frac=0.30
# Chopper: false = spreadCycle (flight, owner rule 2026-09-11: full torque
# headroom for the ball-screw bend); true = stealthChop, bench opt-in only.
motor0.stealth_chop=false
motor0.spi_speed_hz=1000000
motor0.sense_resistor_ohm=0.075
motor0.retry_ms=2000
# 0 inherits pull.accel_steps_per_s2; a positive value overrides for this
# motor (runtime: STEPPER_SET_ACCEL).
motor0.accel_steps_per_s2=0
# The specimens motor 0 pulls, in order: each a PT100's Sequent RTD card
# terminal and, for a heated specimen, its heater's BCM line (ch1 alone is
# unheated). They become S0.. and the heated ones H0.., in this order, and
# the first is the one MAX31865 click 1 reads. Bench wiring: set by
# scripts/associate_heaters.py (auto measures the pairs, assign sets them by
# hand); migrate-config (coatheal-deploy) keeps it. Schematic order below.
motor0.specimens=ch1:19,ch2:13,ch3:6,ch4:5

# --- Motor 1 / STEP2 (samples 4..7, v3 pinout CS on BCM 27, EN on BCM 21) ---
# v3: TMC5160, SPI-only motion — no STEP/DIR.
motor1.driver=tmc5160
motor1.gpio_chip=/dev/gpiochip0
motor1.spi_device=/dev/spidev0.0
motor1.cs_line=27
motor1.enable_line=21
motor1.invert_direction=false
motor1.enable_active_low=true
motor1.run_current_a_rms=0.8
motor1.hold_current_frac=0.30
motor1.stealth_chop=false
motor1.spi_speed_hz=1000000
motor1.sense_resistor_ohm=0.075
motor1.retry_ms=2000
# 0 inherits pull.accel_steps_per_s2; a positive value overrides for this
# motor (runtime: STEPPER_SET_ACCEL).
motor1.accel_steps_per_s2=0
# Motor 1's specimens, continuing the numbering after motor 0's (S4.., H4..);
# the first is on MAX31865 click 2.
motor1.specimens=ch5:24,ch6:23,ch7,ch8
